name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check brew2port.sh syntax
        run: bash -n brew2port.sh
      - name: Build PortCat
        working-directory: PortCat
        run: swift build -c release
      - name: Test PortCat parsers
        working-directory: PortCat
        run: swift test
      - name: Build the app bundle with the swiftc fallback
        working-directory: PortCat
        run: PORTCAT_USE_SWIFTC=1 ./build-app.sh
      - name: Check the fallback app starts
        working-directory: PortCat
        run: |
          test -x build/PortCat.app/Contents/MacOS/PortCat
          codesign --verify --deep build/PortCat.app
